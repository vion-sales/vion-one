name: Govt watch
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check official portals
        run: |
          python3 - <<'PY'
          import json, re, hashlib, os, urllib.request, datetime
          SRC = [
            ("PM Surya Ghar portal", "https://pmsuryaghar.gov.in/"),
            ("Consumer application", "https://consumer.pmsuryaghar.gov.in/consumer/"),
            ("SURYA Gujarat portal", "https://suryagujarat.guvnl.in/"),
          ]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          old = {}
          if os.path.exists("govt_status.json"):
              try:
                  old = {s["url"]: s for s in json.load(open("govt_status.json"))["sources"]}
              except Exception:
                  old = {}
          out = []
          for name, url in SRC:
              prev = old.get(url, {})
              ok, h, title, changed = False, prev.get("hash"), prev.get("title", ""), prev.get("changed")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (VION govt watch)"})
                  html = urllib.request.urlopen(req, timeout=40).read().decode("utf-8", "ignore")
                  html = re.sub(r"(?is)<(script|style|noscript)\b.*?</\1>", " ", html)
                  m = re.search(r"(?is)<title[^>]*>(.*?)</title>", html)
                  title = re.sub(r"\s+", " ", m.group(1)).strip() if m else ""
                  parts = re.findall(r"(?is)<(?:a|h1|h2|h3|h4|li)\b[^>]*>(.*?)</(?:a|h1|h2|h3|h4|li)>", html)
                  texts = []
                  for p in parts:
                      t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", p)).strip()
                      if t and not re.fullmatch(r"[\d,.\s%+-]+", t):
                          texts.append(t)
                  nh = hashlib.sha256("\n".join(sorted(set(texts))).encode()).hexdigest()[:16]
                  ok = len(texts) > 5
                  if ok:
                      if prev.get("hash") and prev["hash"] != nh:
                          changed = now
                      h = nh
              except Exception:
                  ok = False
              out.append({"name": name, "url": url, "ok": ok, "hash": h, "title": title, "changed": changed})
          json.dump({"checked": now, "sources": out}, open("govt_status.json", "w"), indent=1)
          PY
      - name: Commit result
        run: |
          git config user.name "govt-watch"
          git config user.email "govt-watch@users.noreply.github.com"
          git add govt_status.json
          git diff --cached --quiet || (git commit -m "Govt watch: daily check" && git push)
