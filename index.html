<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: sticky brand bar (logo, ASM + month selectors, Present, ULTRON, menu) over page tabs; one full-width column of sections per page; the Mission hero is the only loud element (race chart + half gauges + four tiles); ULTRON is a side drawer; boardroom is a full-screen slideshow. Dark is the default look, light is a toggle. */
:root{
 --bg:#060A17;--bg2:#0A1020;--card:#0D1427;--card2:#111A31;--raise:#16203A;
 --line:rgba(148,163,184,.13);--line2:rgba(148,163,184,.24);--bd:rgba(148,163,184,.13);--grid:rgba(148,163,184,.10);--tint:rgba(148,163,184,.06);--inset:rgba(2,6,23,.42);
 --fg:#E4EAF4;--hi:#FFFFFF;--txt2:#B3BFD4;--mut:#7D8BA6;
 --cyan:#22D3EE;--blue:#3B82F6;--purple:#A78BFA;--pink:#F472B6;--green:#10B981;--orange:#F59E0B;--red:#EF4444;
 --a1:#0FA3BF;--a2:#9A72F2;--a3:#E25A8E;--gold:#D4AF37;
 --vblue:#0A1B4D;--vred:#E30613;
 --glow1:rgba(34,211,238,.07);--glow2:rgba(167,139,250,.07);--shadow:rgba(0,0,0,.42);--navbg:rgba(6,10,23,.9);--heatink:#03121A;--scrim:rgba(2,6,16,.6);
 --disp:'IBM Plex Sans','IBM Plex Sans Devanagari','Segoe UI',system-ui,sans-serif;--body:'IBM Plex Sans','IBM Plex Sans Devanagari','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
 color-scheme:dark}
:root[data-theme="light"]{
 --bg:#F2F5FA;--bg2:#E8EEF6;--card:#FFFFFF;--card2:#F6F8FC;--raise:#FFFFFF;
 --line:rgba(15,23,42,.10);--line2:rgba(15,23,42,.18);--bd:rgba(15,23,42,.10);--grid:rgba(15,23,42,.08);--tint:rgba(15,23,42,.04);--inset:rgba(15,23,42,.035);
 --fg:#0F172A;--hi:#0B1220;--txt2:#334155;--mut:#64748B;
 --cyan:#0891B2;--blue:#2563EB;--purple:#7C3AED;--pink:#DB2777;--green:#059669;--orange:#D97706;--red:#DC2626;
 --a1:#0B8BA6;--a2:#7C55E6;--a3:#D23F7A;--gold:#B8901A;
 --glow1:rgba(8,145,178,.06);--glow2:rgba(124,58,237,.05);--shadow:rgba(15,23,42,.08);--navbg:rgba(255,255,255,.93);--heatink:#FFFFFF;--scrim:rgba(15,23,42,.35);
 color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--body);margin:0;-webkit-font-smoothing:antialiased;
 background-image:radial-gradient(1100px 520px at 16% -12%,var(--glow1),transparent 62%),radial-gradient(820px 480px at 94% -10%,var(--glow2),transparent 60%);background-attachment:fixed;
 padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 88px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--navbg)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.22}
.wrap,.tick{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--disp);margin:0;letter-spacing:0;text-wrap:balance;font-weight:600}
button,select,input{font-family:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.sub2{color:var(--txt2);font-size:13px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* ---------- ticker ---------- */
.tick{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--bg2);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:5px 0;font:12px var(--mono);color:var(--mut)}
.tick .t{display:inline-block;padding-left:100%;animation:tk 80s linear infinite}.tick:hover .t{animation-play-state:paused}
.tick span{margin-right:34px}.tick b{font-weight:500;color:var(--txt2)}.tick .d b{color:var(--red)}.tick .u b{color:var(--green)}
@keyframes tk{to{transform:translateX(-100%)}}
/* ---------- brand bar ---------- */
.brand{position:sticky;top:env(safe-area-inset-top,0px);z-index:55;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:132px;background:var(--vred)}
.brand .bt{display:flex;align-items:center;gap:14px;max-width:1640px;margin:0 auto;flex-wrap:wrap}
.lg{background:#fff;border-radius:10px;padding:3px 10px;display:flex;align-items:center;flex:none;border:0;box-shadow:0 0 0 1px rgba(10,27,77,.18)}
.lg.vkl{background:linear-gradient(90deg,#f9fbff,#f2f5ff);padding:0;overflow:hidden;box-shadow:0 0 0 1px rgba(10,27,77,.12)}.lg.vkl img{height:26px;width:auto}.pw .lg.vkl{padding:0}.pw .lg.vkl img{height:26px}
.vlk{display:inline-flex;vertical-align:middle;background:linear-gradient(90deg,#f9fbff,#f2f5ff);border-radius:8px;overflow:hidden;margin-right:6px}.vlk img{display:block;height:24px;width:auto}
.lg img{display:block;height:30px;width:auto}.lg.home{cursor:pointer}
.bn{min-width:0;display:flex;flex-direction:column}.bn b{font:600 16px var(--disp);color:var(--hi);line-height:1.2;white-space:nowrap}
.bn small{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--mut);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green);flex:none}.dot.bad{background:var(--red)}.dot.warn{background:var(--orange)}.dot.idle{background:var(--mut)}
.hctl{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.sel{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:0 4px 0 10px;height:36px}
.sel span{font:500 11px var(--mono);letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--hi);font:500 13.5px var(--body);padding:6px 24px 6px 2px;cursor:pointer;max-width:190px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.sel select option{background:var(--card);color:var(--fg)}
.hb{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--hi);font:500 13px var(--body);cursor:pointer;white-space:nowrap;transition:border-color .2s,background .2s}
.hb:hover{border-color:var(--cyan)}.hb.pri{background:color-mix(in srgb,var(--cyan) 16%,var(--card));border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
.hb.ic{width:36px;padding:0;justify-content:center}
.pw{display:flex;align-items:center;gap:7px;font:500 11.5px var(--body);color:var(--mut);white-space:nowrap}.pw .lg{padding:3px 8px}.pw .lg img{height:22px}
.tabs{display:flex;gap:2px;max-width:1640px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;background:none;border:0;color:var(--mut);font:500 13px var(--body);padding:9px 13px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center;border-radius:8px 8px 0 0}
.tabs button:hover{color:var(--hi)}
.tabs button.on{color:var(--hi)}.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;background:var(--cyan)}
.tabs .bd2{font:600 10.5px var(--mono);min-width:19px;padding:0 6px;line-height:17px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--blue)) 22%,transparent);color:var(--c,var(--blue));text-align:center}
/* ---------- page ---------- */
.wrap{max-width:1640px;margin:0 auto}
main{min-width:0;display:flex;flex-direction:column;gap:18px;padding-block:18px}
.pgx{display:none!important}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px}
.sec>header h2{font-size:16px;color:var(--hi)}.sec>header .hs{font-size:12.5px;color:var(--mut)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sh{font:500 11px var(--mono);letter-spacing:.12em;color:var(--mut);margin:2px 0 10px;text-transform:uppercase}
.iia{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:16px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.iia>div{padding:10px 12px;background:var(--card2);font-size:12.5px;color:var(--txt2);min-width:0}
.iia b{display:block;font:500 10.5px var(--mono);letter-spacing:.12em;margin-bottom:3px;color:var(--mut)}
.iia>div:nth-child(3) b{color:var(--cyan)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cv{position:relative;height:260px}.cv.tall{height:300px}
.chip{background:var(--card2);border:1px solid var(--line2);color:var(--fg);border-radius:999px;padding:6px 13px;font:500 12.5px var(--body);cursor:pointer;transition:border-color .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--cyan)}.chip[aria-pressed=true]{background:color-mix(in srgb,var(--cyan) 16%,var(--card));border-color:color-mix(in srgb,var(--cyan) 60%,transparent);color:var(--hi)}
.status{font:12px var(--mono);color:var(--mut)}.status.err{color:var(--red)}.status.ok{color:var(--green)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nd::before{display:none}
.tg{font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--c)}
.up{color:var(--green)}.dn{color:var(--red)}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:20px;padding:18px;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(130deg,color-mix(in srgb,var(--cyan) 55%,transparent),color-mix(in srgb,var(--purple) 40%,transparent) 45%,var(--line) 75%) border-box;box-shadow:0 24px 70px -28px color-mix(in srgb,var(--cyan) 30%,transparent)}
.hg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.racec{min-width:0;display:flex;flex-direction:column}
.rh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 18px;flex-wrap:wrap;margin-bottom:8px}
.big{font:600 52px/1 var(--disp);color:var(--hi);letter-spacing:-.01em;margin-top:6px}.big small{font-size:18px;font-weight:500;color:var(--txt2);letter-spacing:0;margin-left:8px}
.rh .ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--txt2)}
.lgd{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--txt2)}.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:16px;height:0;border-top:2px solid var(--c);display:inline-block}.lgd i.dsh{border-top-style:dashed}.lgd i.dot2{border-top-style:dotted}.lgd i.area{height:9px;border:0;background:color-mix(in srgb,var(--c) 22%,transparent);border-radius:2px}
.racecv{position:relative;height:300px;flex:1 1 auto;min-height:240px}
.gcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.gauge{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;text-align:center}
.gauge svg{width:100%;max-width:250px;height:auto;display:block;margin:0 auto;overflow:visible}
.gauge .gl{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--txt2);margin-top:2px}
.gauge .gl b{color:var(--hi);font-weight:600}
.gfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gfoot>div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.gfoot b{display:block;font:600 20px var(--disp);color:var(--hi)}.gfoot span{font-size:11.5px;color:var(--mut)}
.t4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tile .tl{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;align-items:center}
.tile .tv{font:600 28px/1.15 var(--disp);color:var(--hi);white-space:nowrap}.tile .tv small{font-size:14px;font-weight:500;color:var(--txt2);margin-left:4px}
.tile .ts{font-size:12px;color:var(--txt2)}
.tile .viz{margin-top:auto;padding-top:8px}
.trow{display:flex;align-items:center;gap:12px}.trow .tvw{min-width:0;flex:1}
.ringv{width:58px;height:58px;flex:none}
.rbar{position:relative;height:10px;border-radius:5px;background:var(--tint);margin:10px 0 4px}
.rbar .rg{position:absolute;top:0;bottom:0;border-radius:5px;background:color-mix(in srgb,var(--purple) 35%,transparent)}
.rbar .mk{position:absolute;top:-4px;width:2px;height:18px;border-radius:1px;background:var(--purple)}
.rbar .tk{position:absolute;right:0;top:-5px;width:2px;height:20px;background:var(--hi);opacity:.6}
.rlab{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mut)}
.hb2{display:grid;gap:6px;margin-top:6px}.hb2 div{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;font:11.5px var(--mono);color:var(--mut)}
.hb2 i{display:block;height:8px;border-radius:4px;background:var(--c)}.hb2 em{font-style:normal;color:var(--txt2)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--c)}.dots i.h{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.dkey{display:flex;gap:10px;flex-wrap:wrap;font:11px var(--mono);color:var(--mut);margin-top:6px}.dkey span{display:inline-flex;align-items:center;gap:5px}.dkey i{width:8px;height:8px;border-radius:50%;background:var(--c)}.dkey i.h{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
/* four answers */
.ans4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ans4>div{border-top:2px solid var(--line2);padding-top:10px;min-width:0}
.ans4>div:last-child{border-top-color:var(--cyan)}
.ans4 h3{font:500 11px var(--mono);letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin-bottom:6px}
.ans4 p,.ans4 li{margin:0;font-size:13.5px;color:var(--fg)}.ans4 ol{margin:0;padding-left:18px;display:grid;gap:4px}
/* callout */
.callout{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--cyan) 8%,var(--card2));border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);font-size:13px;color:var(--txt2)}.callout b{color:var(--hi)}
/* asm race */
.arace{display:flex;flex-direction:column;gap:16px}
.ar .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.ar .an{display:flex;align-items:center;gap:8px;min-width:0}.ar .an i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.ar .an b{font-weight:600;color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .av{font:600 20px var(--disp);color:var(--hi)}
.ar .trk{position:relative;height:14px;border-radius:7px;background:var(--tint)}
.ar .fl{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--c);width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.ar .pm{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:1px;background:var(--hi);opacity:.75}
.ar .ad{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;color:var(--txt2);flex-wrap:wrap}
.akey{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:4px;flex-wrap:wrap}.akey span{display:inline-flex;gap:6px;align-items:center}.akey i{display:inline-block;width:2px;height:12px;background:var(--hi);opacity:.75}
/* score bars */
.sbars{display:grid;gap:9px}
.sb{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;color:var(--txt2)}
.sb small{color:var(--mut);font:11px var(--mono);margin-left:6px}
.sb .st{height:8px;border-radius:4px;background:var(--tint);position:relative;overflow:hidden}.sb .st i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--c)}
.sb b{font:600 14px var(--disp);color:var(--hi);text-align:right}
.sb.na{opacity:.7}.sb.na .st{background:repeating-linear-gradient(135deg,var(--tint) 0 6px,transparent 6px 12px)}.sb.na b{font-size:11.5px;color:var(--mut);font-weight:500;white-space:nowrap}
.sbt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap}.sbt b{font:600 22px var(--disp);color:var(--hi)}
/* small stat tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{position:relative;padding:13px 14px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.kpi .l{font-size:12.5px;color:var(--mut)}
.kpi .v{font:600 24px var(--disp);color:var(--hi);margin-top:2px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--txt2);margin-bottom:4px}
.kpi .ai{font-size:12px;color:var(--txt2);border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.kpi canvas{width:100%!important;height:34px!important;margin:4px 0 6px}
.kpi.nd{border-style:dashed}.kpi.nd .v{font-size:15px;color:var(--mut);white-space:normal}
.bar{height:6px;border-radius:3px;background:var(--tint);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:3px;background:var(--c);transition:width 1s}
/* tables */
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}

/* ===== gauges & mini visuals ===== */
function gaugeSVG(v,label,sub,col,id){
 const cx=120,cy=118,r=94,P=t=>{const a=Math.PI*(1-t/100);return [cx+r*Math.cos(a),cy-r*Math.sin(a)]},arc=(a,b,rr=r)=>{const a0=Math.PI*(1-a/100),a1=Math.PI*(1-b/100);return `M${(cx+rr*Math.cos(a0)).toFixed(1)} ${(cy-rr*Math.sin(a0)).toFixed(1)} A${rr} ${rr} 0 0 1 ${(cx+rr*Math.cos(a1)).toFixed(1)} ${(cy-rr*Math.sin(a1)).toFixed(1)}`};
 const bands=[[0,60,C.red],[60,70,C.orange],[70,80,C.blue],[80,90,C.green],[90,100,C.cyan]],L=Math.PI*r,vv=clamp(v);
 const p=P(vv);
 return `<svg viewBox="0 0 240 150" role="img" aria-label="${esc(label)} ${Math.round(v)} / 100">${bands.map(b=>`<path d="${arc(b[0]+.6,b[1]-.6,r+15)}" stroke="${b[2]}" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/>`).join('')}
 <path d="${arc(0,100)}" stroke="${C.tint||'rgba(148,163,184,.08)'}" stroke-width="16" fill="none" stroke-linecap="round"/>
 <path id="${id}" class="garc" d="${arc(0,Math.max(.5,vv))}" stroke="${col}" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="0" data-len="${L.toFixed(1)}"/>
 <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="${col}" stroke="${C.card2}" stroke-width="3"/>
 <text x="${cx}" y="${cy-18}" text-anchor="middle" style="font:600 46px var(--disp);fill:var(--hi)" id="${id}n">${Math.round(v)}</text>
 <text x="${cx}" y="${cy+6}" text-anchor="middle" style="font:500 11px var(--mono);letter-spacing:.12em;fill:var(--mut)">${esc(sub)}</text>
 <text x="${cx-r-8}" y="${cy+22}" text-anchor="middle" style="font:11px var(--mono);fill:var(--mut)">0</text><text x="${cx+r+8}" y="${cy+22}" text-anchor="middle" style="font:11px var(--mono);fill:var(--mut)">100</text></svg>`;
}
function ringSVG(p,col){p=clamp(p);const r=24,c=2*Math.PI*r;return `<svg class="ringv" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="${r}" fill="none" stroke="${C.tint}" stroke-width="7"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 29 29)"/><text x="29" y="33" text-anchor="middle" style="font:600 ${p<99.95&&p>=10?11:12}px var(--disp);fill:var(--hi)">${p>=99.95?100:p.toFixed(p<10?1:1)}%</text></svg>`}

 const c=(x,s,l)=>`hsl(${(h+x+360)%360} ${s}% ${l}%)`,m=(x,a)=>`hsl(${(h+x+360)%360} 90% 55% / ${a})`;
 return {p:[c(0,95,62),c(70,90,66),c(150,88,60)],m:[m(0,.45),m(70,.38),m(150,.3),m(220,.4)]}};

 return `:root[data-skin="${z.id}"]{--bg:${bg};--bg2:color-mix(in srgb,${bg} 90%,${p[0]});--card:${cd};--card2:color-mix(in srgb,${cd} 92%,${p[0]});--raise:${cd};

.tsc{width:100%;position:relative;border:1px solid var(--line);border-radius:16px;padding:8px;background:var(--tint);cursor:pointer;text-align:left;color:var(--fg);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.tsc:hover{transform:translateY(-2px)}

function docList(){
 const dm=dmap(),m=new Map();
 scoped().forEach(l=>{let o=m.get(l.i);if(!o){const d=dm.get(String(l.c));o={i:l.i,d:l.d,c:l.c,nm:d?d.name:String(l.c),u:0,n:0,g:0,ls:[]};m.set(l.i,o)}if(isUnit(l))o.u+=l.q;o.n+=l.n;o.g+=l.g;o.ls.push(l)});
 let a=[...m.values()].sort((p,q)=>q.d.localeCompare(p.d)||q.i.localeCompare(p.i));
 const qq=dQ.trim().toLowerCase();if(qq)a=a.filter(o=>o.i.toLowerCase().includes(qq)||o.nm.toLowerCase().includes(qq));
 return a;
}

function distsHTML(){

 const dm=dmap(),L=scoped(),tot=sum(L.map(l=>l.n));
 const dd=new Map(),ss=new Map();
 L.forEach(l=>{const d=dm.get(String(l.c))||{};const k=(d.dt||d.city||tt('Unassigned','अनिर्धारित'))+'|'+(d.state||'');const o=dd.get(k)||{n:k.split('|')[0],st:d.state||'',v:0,c:new Set()};o.v+=l.n;o.c.add(l.c);dd.set(k,o);const so=ss.get(d.state||'—')||{n:d.state||'—',v:0};so.v+=l.n;ss.set(d.state||'—',so)});
 const ds=[...dd.values()].sort((a,b)=>b.v-a.v),mx=Math.max(1,...ds.map(o=>o.v));
 const stT=[...ss.values()].sort((a,b)=>b.v-a.v).map((z,i)=>`<div class="kpi" style="--c:${[C.cyan,C.purple,C.orange][i%3]}"><div class="k">${esc(z.n==='—'?tt('Not in distributor master','डिस्ट्रीब्यूटर मास्टर में नहीं'):z.n)}</div><div class="v">₹${f2(nsvL(z.v))} L</div><div class="s">${tot>0?(z.v/tot*100).toFixed(1):'0.0'}% ${tt('of NSV','NSV का')}</div><div class="lnbar"><i style="width:${tot>0?Math.max(0,Math.min(100,z.v/tot*100)):0}%"></i></div></div>`).join('');

 const body=`${bar()}<div class="lnk">${stT}</div><p class="lnn">${tt('Districts follow the distributor–ASM mapping used in this dashboard. NSV is signed net sales (credits and cancellations included).','ज़िले इस डैशबोर्ड की डिस्ट्रीब्यूटर–ASM मैपिंग के अनुसार हैं। NSV में क्रेडिट और कैंसिलेशन शामिल हैं।')}</p>`;

 (D.dist||[]).filter(d=>d.code&&(scope==='All'||d.asm===scope)).forEach(d=>{if(!m.has(String(d.code)))m.set(String(d.code),{c:String(d.code),v:0,docs:new Set(),last:''})});

function swap(id,focusQ){
 const el=document.getElementById(id);if(!el)return;
 const t=document.createElement('div');t.innerHTML=FN[id]().replace(/<section([^>]*?) id="(s-[a-z]+)"/,(m_,pre,i)=>`<section${pre} id="${i}" data-pg="${PGOF[i]}"`);
 const n=t.firstElementChild;n.classList.toggle('pgx',el.classList.contains('pgx'));el.replaceWith(n);
 if(focusQ){const q=document.getElementById('docQ');if(q){q.focus();const l=q.value.length;try{q.setSelectionRange(l,l)}catch(e){}}}
}
const redraw=()=>['s-prods','s-docs','s-dists','s-custs'].forEach(i=>swap(i));

 const t=e.target.closest&&e.target.closest('[data-lnp],[data-lnm],[data-dpg],[data-go],tr.dr');if(!t)return;
 if(t.dataset.go){if(typeof setPage==='function')setPage(t.dataset.go);return}
 if(t.dataset.lnp!==undefined){lnP=t.dataset.lnp;dPg=0;redraw()}
 else if(t.dataset.lnm){lnM=t.dataset.lnm;swap('s-prods')}
 else if(t.dataset.dpg){dPg=Math.max(0,dPg+ +t.dataset.dpg);swap('s-docs')}
 else if(t.classList.contains('dr')){const k=t.dataset.doc;dOpen.has(k)?dOpen.delete(k):dOpen.add(k);swap('s-docs')}
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='docQ'){dQ=e.target.value;dPg=0;swap('s-docs',true)}});
})();

.gvl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.gvl a{display:inline-block;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--hi);text-decoration:none;font:600 12px var(--body);background:var(--card2)}
.gvl a:hover{border-color:var(--cyan)}

function prep(j){

 j.rows=rows;j.uniq=uniq.size;j.sts=[...sts].sort();
 j.dists=j.d.map(([s,d,asm,rs])=>({s,d,asm,n:rs.length,kw:sum(rs.map(r=>r[4]||0)),p:sum(rs.map(r=>r[5]||0)),vk:rs.filter(r=>r[1].includes(9)).length}));

/* ---------- Solar: rooftop calculator + brand mix ---------- */
const SC={bill:2500,tar:6,yld:120,cost:54000,roof:'',state:'GJ',cat:'gen',bst:'All'};
function calc(){
 const tar=+SC.tar||6,yl=+SC.yld||120,bill=+SC.bill||0,cpk=+SC.cost||54000;const units=bill/tar,need=units/yl;
 let kw=Math.max(1,Math.ceil(need-1e-9));const roofKw=SC.roof?Math.floor(SC.roof/10):null;let capped=false;
 if(roofKw!==null&&roofKw<kw){kw=Math.max(0,roofKw);capped=true}
 if(kw<1)return {kw:0,capped,units,need};
 const cost=kw*cpk,gen=kw*yl*12,sav=Math.min(gen,units*12)*tar;
 let sub=null,note='';
 if(kw>=3&&(SC.state==='GJ'||SC.state==='MP'))sub=CEN3;
 else if(SC.state==='GJ'&&SUBS['GJ|'+SC.cat+'|'+kw])sub=SUBS['GJ|'+SC.cat+'|'+kw][2];
 else note=tt('Subsidy for this size/state is not listed here yet. Confirm on the official portal.','इस साइज़/राज्य की सब्सिडी यहाँ अभी सूचीबद्ध नहीं है। आधिकारिक पोर्टल पर जाँचें।');
 const net=cost-(sub||0);
 return {kw,cost,gen,sav,sub,net,note,capped,units,need,panels:Math.ceil(kw*1000/540),roof:kw*10,pay:sav>0?net/sav:0};
}
function brandMix(){
 const rows=G.rows.filter(r=>SC.bst==='All'||r.s===SC.bst);
 const cnt=G.brands.map(()=>0);let any=0;rows.forEach(r=>{if(r.b.length)any++;r.b.forEach(i=>cnt[i]++)});
 const arr=cnt.map((c,i)=>({n:G.brands[i],c,i})).filter(o=>o.c>0).sort((a,b)=>b.c-a.c);const mx=Math.max(1,...arr.map(o=>o.c));
 return {arr,mx,rows:rows.length,any};
}

 const mixH=`<div class="gvh">${tt('Solar brand mix among registered vendors','पंजीकृत वेंडरों में सोलर ब्रांड मिक्स')}</div>

 if(!GS||!GS.sources){return `<div class="gvw"><b>${tt('Govt watch','सरकारी निगरानी')}</b> · ${tt('The daily check of the official portals has not reported yet. Until then, figures below are as last confirmed on ','आधिकारिक पोर्टलों की रोज़ की जाँच की रिपोर्ट अभी नहीं आई। तब तक नीचे के आँकड़े अंतिम पुष्टि के अनुसार हैं: ')}${ASOF}.</div>`}
 const fmt=s=>s?new Date(s).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'}):'—';
 const recent=GS.sources.filter(s=>s.changed&&(Date.now()-new Date(s.changed))<30*864e5);
 return `<div class="gvw ${recent.length?'chg':''}"><b>${tt('Govt watch','सरकारी निगरानी')}</b> · ${tt('last checked','अंतिम जाँच')} ${fmt(GS.checked)}.
 ${!GS.sources.some(s=>s.ok)?`<br><b>${tt('The daily check could not read the official portals (they may block automated visits). Figures below are as last confirmed on ','दैनिक जाँच आधिकारिक पोर्टल नहीं पढ़ सकी (वे ऑटोमेटेड विज़िट रोक सकते हैं)। नीचे के आँकड़े अंतिम पुष्टि के अनुसार हैं: ')}${ASOF}. ${tt('Please check the portals directly.','कृपया पोर्टल सीधे देखें।')}</b>`:recent.length?`<br><b>${tt('Update detected on the official portal. Please verify the figures below before quoting them:','आधिकारिक पोर्टल पर बदलाव मिला। उद्धृत करने से पहले नीचे के आँकड़े जाँचें:')}</b> ${recent.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a> (${fmt(s.changed)})`).join(', ')}`:`<br>${tt('No change detected on the official portals.','आधिकारिक पोर्टलों पर कोई बदलाव नहीं मिला।')}`}
 <br>${GS.sources.map(s=>`${esc(s.name)}: ${s.ok?tt('reachable','उपलब्ध'):tt('not reachable','उपलब्ध नहीं')}`).join(' · ')}</div>`;
}

function swap(id){
 const el=document.getElementById(id);if(!el)return;
 const t=document.createElement('div');t.innerHTML=FN[id]().replace(/<section([^>]*?) id="(s-[a-z]+)"/,(m_,pre,i)=>`<section${pre} id="${i}" data-pg="${PGOF[i]}"`);
 const n=t.firstElementChild;n.classList.toggle('pgx',el.classList.contains('pgx'));el.replaceWith(n);
}
function redraw(){Object.keys(FN).forEach(i=>swap(i))}
const keep=(id,fn)=>{const a=document.activeElement,sel=a&&a.id,p=a&&a.selectionStart;fn();if(sel){const e=document.getElementById(sel);if(e){e.focus();try{e.setSelectionRange(p,p)}catch(_){}}}};
document.addEventListener('click',e=>{
 const t=e.target.closest&&e.target.closest('[data-mv],[data-mvp]');if(!t)return;
 if(t.dataset.mv){MV.view=t.dataset.mv;MV.pg=0}else MV.pg=Math.max(0,MV.pg+ +t.dataset.mvp);swap('s-mnre');
});
document.addEventListener('input',e=>{
 const t=e.target;if(!t||!t.dataset)return;
 if(t.dataset.mvq!==undefined){MV.q=t.value;MV.pg=0;keep('s-mnre',()=>swap('s-mnre'))}
 else if(t.dataset.sc&&t.tagName==='INPUT'){SC[t.dataset.sc]=t.type==='number'?(t.value===''?'':+t.value):t.value;
  const k=t.dataset.sc,p=t.selectionStart;swap('s-solar');const n=document.querySelector('[data-sc="'+k+'"]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}
});
document.addEventListener('change',e=>{
 const t=e.target;if(!t||!t.dataset)return;
 if(t.dataset.sc&&t.tagName==='SELECT'){SC[t.dataset.sc]=t.value;swap('s-solar')}
 else if(t.dataset.mvs){MV[t.dataset.mvs]=t.value;MV.pg=0;if(t.dataset.mvs==='st')MV.d='All';swap('s-mnre')}
});
})();

/* ===== Tab bar arrows: previous / next, so tabs beyond the screen edge can be reached ===== */
(function(){
const st=document.createElement('style');st.id='tabArrowCss';st.textContent=`
.tabArr{display:none!important}.tabs{flex-wrap:wrap;overflow:visible;row-gap:0}.tabs button{padding:8px 11px 10px}@media(max-width:560px){.tabs button{padding:7px 9px 9px;font-size:12px;gap:5px}.brand{position:static!important}}.tabArrX{position:absolute;z-index:6;display:none;align-items:center;border:0;cursor:pointer;color:var(--hi);font:700 20px var(--body);padding:0 12px;background:linear-gradient(to var(--d,right),transparent,var(--card) 60%)}
.tabArr.show{display:flex}#tabPrev{--d:left;justify-content:flex-start}#tabNext{--d:right;justify-content:flex-end}
.tabArr span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:var(--card2)}
.tabArr:hover span{border-color:var(--cyan)}`;
document.head.appendChild(st);
function mk(id,txt,dir){let b=document.getElementById(id);if(b)return b;b=document.createElement('button');b.id=id;b.className='tabArr';b.type='button';b.setAttribute('aria-label',dir<0?'Previous tabs':'Next tabs');b.innerHTML='<span>'+txt+'</span>';
 b.onclick=()=>{const t=document.getElementById('tabs');if(t)t.scrollBy({left:dir*Math.max(160,t.clientWidth*.6),behavior:'smooth'})};
 const h=document.getElementById('brand');if(h){if(getComputedStyle(h).position==='static')h.style.position='relative';h.appendChild(b)}return b}
function sync(){
 const t=document.getElementById('tabs'),h=document.getElementById('brand');if(!t||!h)return;
 const p=mk('tabPrev','‹',-1),n=mk('tabNext','›',1),hr=h.getBoundingClientRect(),tr=t.getBoundingClientRect();
 [[p,tr.left-hr.left,t.scrollLeft>4],[n,tr.right-hr.left-52,t.scrollLeft+t.clientWidth<t.scrollWidth-4]].forEach(([b,x,on])=>{b.style.top=(tr.top-hr.top)+'px';b.style.height=tr.height+'px';b.style.left=x+'px';b.style.width='52px';b.classList.toggle('show',on)})}
function reveal(){const t=document.getElementById('tabs');const a=t&&t.querySelector('button.on');if(!a)return;const l=a.offsetLeft,r=l+a.offsetWidth;
 if(l<t.scrollLeft+40)t.scrollTo({left:Math.max(0,l-60),behavior:'smooth'});else if(r>t.scrollLeft+t.clientWidth-40)t.scrollTo({left:r-t.clientWidth+60,behavior:'smooth'});setTimeout(sync,350)}
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='tabs')sync()},true);
window.addEventListener('resize',sync);
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#tabs button,#bnav [data-pg]'))setTimeout(reveal,60)});
new MutationObserver(()=>setTimeout(sync,0)).observe(document.body,{childList:true,subtree:true,attributes:false});
setInterval(sync,1500);setTimeout(sync,500);
})();

/* ===== Full view: hides the top bar and tabs for a clean full-screen read; Esc (or the pill) returns to the basic view ===== */
(function(){
const c=document.createElement('style');c.id='fvCss';c.textContent=`
body.fv #brand,body.fv #bnav,body.fv .tick{display:none!important}
body.fv main{padding-top:56px}
#fvPill{position:fixed;z-index:2147482000;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:none;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);color:var(--hi);font:600 12.5px var(--body);box-shadow:0 8px 30px rgba(0,0,0,.35)}
body.fv #fvPill{display:flex}
#fvPill button{border:1px solid var(--line2);background:var(--card2);color:var(--hi);border-radius:999px;min-width:30px;height:30px;padding:0 10px;font:600 12.5px var(--body);cursor:pointer}
#fvPill button:hover{border-color:var(--cyan)}#fvPill .nm{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}`;
document.head.appendChild(c);
const pill=document.createElement('div');pill.id='fvPill';pill.innerHTML='<button type="button" data-fv="-1" aria-label="Previous tab">‹</button><span class="nm" id="fvNm"></span><button type="button" data-fv="1" aria-label="Next tab">›</button><button type="button" data-fv="x">Esc · Back</button>';
document.body.appendChild(pill);
const nm=()=>{const p=PAGES.find(z=>z[0]===page);const e=document.getElementById('fvNm');if(e&&p)e.textContent=tt(p[1],p[2])};
function on(){document.body.classList.add('fv');nm();window.scrollTo({top:0,behavior:'auto'});try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function off(){document.body.classList.remove('fv');try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
const toggle=()=>document.body.classList.contains('fv')?off():on();
function step(d){const i=PAGES.findIndex(z=>z[0]===page);const n=PAGES[(i+d+PAGES.length)%PAGES.length];setPage(n[0]);nm()}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-fv],#bFull');if(!t)return;
 if(t.id==='bFull'){toggle();return}
 if(t.dataset.fv==='x')off();else step(+t.dataset.fv)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('fv')){off()}
 else if(document.body.classList.contains('fv')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||''))){step(e.key==='ArrowRight'?1:-1)}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fv'))document.body.classList.remove('fv')});
function ensure(){const h=document.getElementById('hctl');if(h&&!document.getElementById('bFull')){const b=document.createElement('button');b.id='bFull';b.type='button';b.className='hb';b.title=tt('Full view (Esc to go back)','फुल व्यू (वापस जाने के लिए Esc)');b.textContent=tt('Full view','फुल व्यू');h.insertBefore(b,h.firstChild)}}
new MutationObserver(ensure).observe(document.body,{childList:true,subtree:true});setInterval(ensure,1500);ensure();

.rvk>div{background:var(--card2,var(--card));border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;border-left:3px solid var(--c,var(--cyan))}

<script>
/* ===== VION secure access: shared crypto core (browser + build script) =====
   Each territory ("scope") has its own random 256-bit data key (DK). The data for that scope is
   AES-GCM encrypted with its DK. Each login wraps the DK(s) it may open with a key derived from
   its password (PBKDF2-SHA256). The admin login wraps every DK, so it can reset passwords and
   publish refreshed data. Nothing readable is stored in the published files. */
(function(G){
 const C=G.crypto, S=C.subtle, enc=new TextEncoder(), dec=new TextDecoder();
 const ITER=250000;

 const ub64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

 async function kek(pw,salt,iter){const base=await S.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return S.deriveKey({name:'PBKDF2',salt,iterations:iter||ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

 async function unseal(key,o,aad){return new Uint8Array(await S.decrypt({name:'AES-GCM',iv:ub64(o.iv),additionalData:enc.encode(aad)},key,ub64(o.ct)))}
 const normId=s=>String(s||'').trim().toLowerCase();
 // password: 3 groups of 4 from an alphabet without look-alikes (≈69 bits)
 const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';

  for(const sc of Object.keys(dks))wk[sc]=await seal(k,dks[sc],'wk|'+normId(u.id)+'|'+sc);
  return {id:normId(u.id),name:u.name,role:u.role,scope:u.scope,salt:b64(salt),iter:ITER,wk}}

  ${note?`<div class="vpwbox">${note}</div>`:''}
  <div class="vtw"><table><thead><tr><th>${T('Login ID','लॉगिन ID')}</th><th>${T('Name','नाम')}</th><th>${T('Can see','क्या देख सकते हैं')}</th><th></th></tr></thead><tbody>
  ${USERS.users.map((u,i)=>`<tr><td><b>${esc(u.id)}</b>${u.id===ME.id?` <small>(${T('you','आप')})</small>`:''}</td><td>${esc(u.name)}</td><td>${access(u)}</td><td style="white-space:nowrap">${u.id===ME.id?`<button class="vb o" data-me="1">${T('Change my password','मेरा पासवर्ड बदलें')}</button>`:`<button class="vb" data-rs="${i}">${T('Reset password','पासवर्ड रीसेट')}</button><button class="vb r" data-rm="${i}">${T('Remove','हटाएँ')}</button>`}</td></tr><tr id="vrr${i}" hidden><td colspan="4"></td></tr>`).join('')}
  </tbody></table></div>
  <h3>${T('Add a login','नया लॉगिन जोड़ें')}</h3>
  <div class="vrow"><input id="vaid" placeholder="${T('Login ID e.g. ravi','लॉगिन ID जैसे ravi')}" autocapitalize="none" spellcheck="false"><input id="vanm" placeholder="${T('Full name','पूरा नाम')}">
   <select id="varl">${asmOpts.map(a=>`<option value="asm|${esc(a)}">${esc(a)} · ${T('own territory','अपना क्षेत्र')}</option>`).join('')}<option value="viewer|ALL">${T('Whole zone · view only','पूरा ज़ोन · केवल देखें')}</option><option value="admin|ALL">${T('Admin · whole zone + manage logins','एडमिन · पूरा ज़ोन + लॉगिन प्रबंधन')}</option></select>
   <button class="vb g" id="vadd">${T('Add','जोड़ें')}</button></div><div class="verr2" id="vadde"></div>
  <h3>${T('Publish data to the team','टीम के लिए डेटा प्रकाशित करें')}</h3>
  <p class="vnote">${T('Data on screen now','अभी स्क्रीन पर डेटा')}: ${esc(d&&d.asof||'–')} · ${T('published for the team','टीम के लिए प्रकाशित')}: ${esc(DATAF.asof||'–')}. ${T('After Upload Excel, use this to send the new figures to every login (each ASM still gets only his territory).','Excel अपलोड के बाद, नए आंकड़े हर लॉगिन तक भेजने के लिए इसका उपयोग करें (हर ASM को केवल उसका क्षेत्र मिलेगा)।')}</p>
  <div class="vrow" style="margin-top:8px"><button class="vb" id="vpub">${T('Prepare data.enc.json','data.enc.json तैयार करें')}</button></div>
  ${dirtyU||dirtyD?`<div class="vpend"><b>${T('Changes are ready. Upload them to make them live:','बदलाव तैयार हैं। लाइव करने के लिए अपलोड करें:')}</b>
   <div class="vrow" style="margin-top:8px">${dirtyU?`<button class="vb" id="vdlu">${T('Download users.json','users.json डाउनलोड करें')}</button>`:''}${dirtyD?`<button class="vb" id="vdld">${T('Download data.enc.json','data.enc.json डाउनलोड करें')}</button>`:''}</div>
   <ol><li>${T('Open','खोलें')} github.com/vion-sales/vion-one → <b>Add file → Upload files</b>.</li><li>${T('Drop the downloaded file(s). The names must stay exactly','डाउनलोड हुई फ़ाइल(ें) डालें। नाम बिल्कुल यही रहें')} <b>users.json</b> / <b>data.enc.json</b>.</li><li>${T('Click Commit changes. The site updates in 1–2 minutes; until then the old passwords keep working.','Commit changes दबाएँ। 1–2 मिनट में साइट अपडेट होगी; तब तक पुराने पासवर्ड चलते रहेंगे।')}</li></ol></div>`:''}
  </div>`;
  $('vxc').onclick=closeAdmin;
  w.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>resetRow(+b.dataset.rs));
  w.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removeRow(+b.dataset.rm));
  const mb=w.querySelector('[data-me]');if(mb)mb.onclick=()=>meRow();
  $('vadd').onclick=addUser;$('vpub').onclick=async()=>{await publish();draw(T('data.enc.json is ready to download below.','data.enc.json नीचे डाउनलोड के लिए तैयार है।'))};
  const u1=$('vdlu');if(u1)u1.onclick=()=>dl('users.json',USERS);const d1=$('vdld');if(d1)d1.onclick=()=>dl('data.enc.json',DATAF);
 }
 const shown=(id,pw)=>`${T('New password for','नया पासवर्ड')} <b>${esc(id)}</b>: <code>${esc(pw)}</code> <button class="vb o" data-copy="${esc(pw)}">${T('Copy','कॉपी')}</button><br><small>${T('Share it with the user privately. It works after users.json is uploaded.','इसे उपयोगकर्ता को निजी रूप से दें। users.json अपलोड होने के बाद यह काम करेगा।')}</small>`;
 function wireCopy(){document.querySelectorAll('#vadm [data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent=T('Copied','कॉपी हुआ')}catch(e){b.textContent=T('Select and copy','चुनकर कॉपी करें')}})}
 function pwForm(i,label,onOk){const tr=$('vrr'+i);tr.hidden=false;const p=V.genPw();
  tr.firstElementChild.innerHTML=`<div class="vrow"><input id="vnp${i}" value="${esc(p)}" autocomplete="new-password" spellcheck="false" aria-label="${T('New password','नया पासवर्ड')}"><button class="vb o" id="vng${i}">${T('New suggestion','नया सुझाव')}</button><button class="vb g" id="vok${i}">${label}</button><button class="vb o" id="vcn${i}">${T('Cancel','रद्द')}</button></div><div class="verr2" id="vne${i}"></div>`;
  $('vng'+i).onclick=()=>{$('vnp'+i).value=V.genPw()};$('vcn'+i).onclick=()=>{tr.hidden=true};
  $('vok'+i).onclick=async()=>{const v=$('vnp'+i).value;if(v.length<10){$('vne'+i).textContent=T('Use at least 10 characters.','कम से कम 10 अक्षर रखें।');return}
   $('vok'+i).disabled=true;try{await onOk(v)}catch(e){$('vne'+i).textContent=String(e.message||e);$('vok'+i).disabled=false}}}
 function resetRow(i){const u=USERS.users[i];pwForm(i,T('Reset','रीसेट'),async pw=>{USERS.users[i]=await V.makeUser(u,pw,dksFor(u));dirtyU=true;draw(shown(u.id,pw));wireCopy()})}
 function meRow(){const i=USERS.users.findIndex(u=>u.id===ME.id);pwForm(i,T('Change','बदलें'),async pw=>{const r=await V.makeUser(ME,pw,Object.assign({},KEYS));USERS.users[i]=r;ME=r;MEKEK=await V.kekFor(r,pw);dirtyU=true;
  draw(T('Your new password is set. Download and upload users.json to make it live.','आपका नया पासवर्ड सेट है। लाइव करने के लिए users.json डाउनलोड करके अपलोड करें।'))})}
 async function removeRow(i){const u=USERS.users[i];
  if(!confirmIn(i,T('Remove','हटाएँ')+' '+u.id+'?',async()=>{
   USERS.users.splice(i,1);let msg=T('Removed','हटाया गया')+' '+esc(u.id)+'.';
   const sc=u.role==='asm'?u.scope:'ALL';
   const sharers=USERS.users.filter(x=>x.role!=='admin'&&(x.role==='asm'?x.scope:'ALL')===sc);
   const otherAdmins=USERS.users.filter(x=>x.role==='admin'&&x.id!==ME.id);
   if(!sharers.length&&!(sc==='ALL'&&otherAdmins.length)){KEYS[sc]=V.rnd(32);await saveMe();await publish();
    otherAdmins.forEach(a=>{delete a.wk[sc]});
    msg+=' '+T('Their key was replaced, so the old password cannot open new data. Upload both files below.','उनकी चाबी बदल दी गई है, पुराना पासवर्ड नया डेटा नहीं खोल पाएगा। नीचे की दोनों फ़ाइलें अपलोड करें।')+(otherAdmins.length?' '+T('Other admins need a password reset to see this territory again.','दूसरे एडमिन को यह क्षेत्र फिर देखने के लिए पासवर्ड रीसेट चाहिए।'):'')}
   else msg+=' '+T('Other logins still share this access, so the key was kept. Reset their passwords too if access must be fully cut.','दूसरे लॉगिन यह एक्सेस साझा करते हैं, इसलिए चाबी नहीं बदली। पूरा एक्सेस हटाने के लिए उनके पासवर्ड भी रीसेट करें।');
   dirtyU=true;draw(msg)}))return}
 function confirmIn(i,q,fn){const tr=$('vrr'+i);tr.hidden=false;tr.firstElementChild.innerHTML=`<div class="vrow"><span>${esc(q)}</span><button class="vb r" id="vyes${i}">${T('Yes, remove','हाँ, हटाएँ')}</button><button class="vb o" id="vno${i}">${T('Cancel','रद्द')}</button></div>`;
  $('vyes'+i).onclick=fn;$('vno'+i).onclick=()=>{tr.hidden=true};return true}
 async function addUser(){const e=$('vadde'),id=V.normId($('vaid').value),nm=$('vanm').value.trim(),[role,scope]=$('varl').value.split('|');
  if(!/^[a-z0-9._-]{3,30}$/.test(id)){e.textContent=T('Login ID: 3–30 letters, digits, dot, dash or underscore.','लॉगिन ID: 3–30 अक्षर, अंक, डॉट, डैश या अंडरस्कोर।');return}
  if(USERS.users.some(u=>u.id===id)){e.textContent=T('That login ID already exists.','यह लॉगिन ID पहले से है।');return}
  if(!nm){e.textContent=T('Enter the full name.','पूरा नाम डालें।');return}
  $('vadd').disabled=true;let newScope=false;
  if(role==='asm'&&!KEYS[scope]){KEYS[scope]=V.rnd(32);newScope=true;await saveMe();await publish()}
  const pw=V.genPw(),u={id,name:nm,role,scope:role==='asm'?scope:'ALL'};
  const rec=await V.makeUser(u,pw,role==='admin'?Object.assign({},KEYS):(role==='viewer'?{ALL:KEYS.ALL}:{[scope]:KEYS[scope]}));
  USERS.users.push(rec);dirtyU=true;draw(shown(id,pw)+(newScope?'<br><small>'+T('New territory: upload data.enc.json too.','नया क्षेत्र: data.enc.json भी अपलोड करें।')+'</small>':''));wireCopy()}
 async function publish(){const d=curD();if(!d)return;DATAF=await V.sealData(d,KEYS);dirtyD=true}
 function logout(){SS.del('vion-sess');try{sessionStorage.removeItem('vion-boot')}catch(e){}location.reload()}
 window.VAUTH={openAdmin,logout,me:()=>ME&&{id:ME.id,name:ME.name,role:ME.role}};
 addEventListener('keydown',e=>{if(e.key==='Escape'&&$('vadm'))closeAdmin()});

 (async()=>{if(!(window.crypto&&crypto.subtle)){document.body.innerHTML='<p style="padding:24px;font:16px sans-serif">This browser cannot open this dashboard securely. Please use a current Chrome, Edge or Safari.</p>';return}
  if(!(await resume()))showLogin()})();
})();

</script>
</body></html>
